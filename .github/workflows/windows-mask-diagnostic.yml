name: Windows mask signal diagnostic
on:
  push:
    branches: [diagnose/windows-pyqt5-mask-signal]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QT_API: PyQt5
      SILX_OPENCL: 'False'
      WITH_GL_TEST: 'True'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - uses: ./.github/actions/setup-system
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-wheel
          path: dist
          run-id: 39888817166
          github-token: ${{ github.token }}
      - name: Install matching GUI and test dependencies
        run: |
          python -m pip install --pre -r diagnostics/windows-original-requirements.txt
          python -m pip install --no-deps dist/silx*.whl
      - name: Trace interaction in full-suite context
        run: python diagnostics/mask_signal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-diagnostic-output
          path: diagnostics/output


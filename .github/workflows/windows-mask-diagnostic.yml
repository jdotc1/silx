name: Windows mask signal diagnostic
on:
  push:
    branches: [diagnose/windows-pyqt5-mask-signal]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QT_API: PyQt5
      SILX_OPENCL: 'False'
      WITH_GL_TEST: 'True'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
      - uses: ./.github/actions/setup-system
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-wheel
          path: dist
          run-id: 39888817166
          github-token: ${{ github.token }}
      - name: Install matching GUI and test dependencies
        run: |
          python -m pip install PyQt5==5.15.11 PyQt5-Qt5==5.15.2 PyQt5-sip==12.20.0 numpy==1.26.4 pytest==9.1.1 matplotlib==3.10.9 h5py==3.16.0 scipy==1.15.3 fabio==2025.10.0 PyOpenGL==4.0.0a8 pytest-mock==3.17.0 pytest-cov==7.1.0 filelock==3.21.0 pydantic==2.14.1 requests==2.34.2 qtawesome==1.4.2 qtconsole==5.7.2
          python -m pip install --no-deps dist/silx*.whl
      - name: Trace only the failing interaction
        run: python diagnostics/mask_signal.py
